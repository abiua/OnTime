name: Windows release

on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'src/**', 'scripts/**', 'tests/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run runtime:install
      - run: npm run check
      - run: npm test
      - run: npm run build:win
      - name: Install, launch, and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          Write-Host 'Installing the per-user MSI'
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -PassThru
          if (!$result.WaitForExit(90000) -or $result.ExitCode -ne 0) { throw "MSI install failed or timed out ($($result.ExitCode))" }
          $env:ONTIME_INSTALLED_EXE = Join-Path $env:LOCALAPPDATA 'Programs/OnTime/OnTime.exe'
          try {
            Write-Host 'Starting the installed OnTime.exe'
            node scripts/check-installed.cjs
            if ($LASTEXITCODE) { throw "Installed app failed startup check" }
          } finally {
            Write-Host 'Uninstalling the MSI'
            $result = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -PassThru
            if (!$result.WaitForExit(90000) -or $result.ExitCode -ne 0 -or (Test-Path $env:ONTIME_INSTALLED_EXE)) { throw "MSI uninstall failed or timed out" }
          }
      - name: Publish versioned installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot list releases' }
          if ($existing.tagName -contains $tag) { Write-Host "$tag already published"; exit 0 }
          $files = @(Get-ChildItem dist -File | Where-Object Name -in @("OnTime-$version-windows-x64.msi", "OnTime-$version-windows-x64.msi.sha256") | ForEach-Object FullName)
          if ($files.Count -ne 2) { throw 'Missing installer or checksum' }
          gh release create $tag @files --target $env:GITHUB_SHA --title "OnTime $version" --notes "Windows x64 安装包。下载 MSI，双击安装后从开始菜单打开 OnTime。SHA-256 校验文件和对应版本源码见下方 Assets。此版本未使用代码签名。"
